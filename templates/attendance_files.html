<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Files</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f9f3f3;
            color: #331717;
        }

        .files-page {
            max-width: 900px;
        }
    </style>
</head>

<body class="p-4">
    <main class="files-page mx-auto">
        <div class="d-flex justify-content-between align-items-center gap-3 mb-4">
            <h1 class="h4 fw-bold mb-0">Saved attendance files</h1>
            <a href="{{ url_for('admin') }}" class="btn btn-outline-secondary btn-sm">Back to dashboard</a>
        </div>

        <section class="card border-0 rounded-4 shadow-sm">
            <div class="card-body p-4">
                {% if files %}
                    <ul class="list-group list-group-flush">
                        {% for filename in files %}
                            <li class="list-group-item d-flex justify-content-between align-items-center gap-3 py-3">
                                <span class="small text-break">{{ filename }}</span>
                                <a href="{{ url_for('download_old_attendance', filename=filename) }}" class="btn btn-outline-success btn-sm flex-shrink-0">Download</a>
                            </li>
                        {% endfor %}
                    </ul>
                {% else %}
                    <p class="text-secondary text-center mb-0">No saved attendance files.</p>
                {% endif %}
            </div>
        </section>
    </main>
</body>
</html>
