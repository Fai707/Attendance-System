<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f9f3f3;
        }

        .login-card {
            max-width: 420px;
        }

        .btn-primary {
            --bs-btn-bg: #e54646;
            --bs-btn-border-color: #e54646;
            --bs-btn-hover-bg: #ca3838;
            --bs-btn-hover-border-color: #ca3838;
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center min-vh-100 p-4">
    <main class="login-card card w-100 rounded-4 shadow-sm border-0">
        <div class="card-body p-4 p-sm-5">
            <span class="badge text-bg-light border mb-3">Instructor access</span>
            <h1 class="h3 fw-bold">Admin login</h1>
            <p class="text-secondary small mb-4">Sign in to view the current classroom code.</p>

            {% if error %}
                <div class="alert alert-danger" role="alert">{{ error }}</div>
            {% endif %}

            <form action="{{ url_for('admin_login') }}" method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <label for="password" class="form-label small fw-semibold">Admin password</label>
                <input id="password" name="password" type="password" class="form-control form-control-lg rounded-3 mb-3" autocomplete="current-password" required>

                <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 fw-semibold">Sign in</button>
            </form>

            <a href="{{ url_for('index') }}" class="d-block text-center text-secondary small mt-4">Back to student attendance</a>
        </div>
    </main>
</body>
</html>
