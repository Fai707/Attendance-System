<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        body {
            background: #f3f5f9;
            color: #172033;
        }

        .attendance-card {
            max-width: 440px;
        }

        .attendance-icon {
            width: 52px;
            height: 52px;
            background: #eef2ff;
            color: #4f46e5;
        }

        .form-control {
            min-height: 52px;
        }

        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 .25rem rgb(79 70 229 / 15%);
        }

        .otp-input {
            letter-spacing: 8px;
        }

        .btn-primary {
            --bs-btn-bg: #4f46e5;
            --bs-btn-border-color: #4f46e5;
            --bs-btn-hover-bg: #4338ca;
            --bs-btn-hover-border-color: #4338ca;
            --bs-btn-active-bg: #3730a3;
            --bs-btn-active-border-color: #3730a3;
            --bs-btn-focus-shadow-rgb: 79, 70, 229;
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center min-vh-100 p-4">
    <main class="attendance-card card w-100 rounded-4 border-light-subtle shadow-sm">
        <div class="card-body p-4 p-sm-5">
            <div class="attendance-icon d-flex justify-content-center align-items-center rounded-4 mb-4" aria-hidden="true">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="5" width="16" height="16" rx="3"/>
                    <path d="M8 3v4M16 3v4M4 11h16M9 16l2 2 4-4"/>
                </svg>
            </div>

            <h1 class="h3 fw-bold mb-2">Mark your attendance</h1>
            <p class="text-secondary small mb-4">Enter your student ID and the verification code shared in class.</p>

            <form action="{{ url_for('attend') }}" method="get">
                <div class="mb-4">
                    <label for="student-id" class="form-label small fw-semibold">Student ID</label>
                    <input id="student-id" name="student_id" type="text" class="form-control rounded-3" placeholder="Enter your student ID" required>
                </div>

                <label for="otp" class="form-label small fw-semibold">Verification code</label>
                <div class="d-flex flex-column">
                    <input id="otp" name="otp" type="text" class="form-control otp-input text-center fs-5 rounded-3 rounded-bottom-0" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" placeholder="000000" aria-describedby="otp-hint" required>
                    <button type="submit" class="btn btn-primary rounded-3 rounded-top-0 py-3 fw-semibold">Submit attendance →</button>
                </div>

                <p id="otp-hint" class="form-text mt-2 mb-0">Enter the 6-digit code provided by your instructor.</p>
            </form>
        </div>
    </main>
</body>
</html>
